name: Backup database
# Щодня створює ЗАШИФРОВАНУ копію БД і зберігає її як artifact на 30 днів.
# ВАЖЛИВО: репозиторій має бути ПРИВАТНИМ. Копія шифрується AES-256, але дані покупців у ній — персональні.
# Потрібні секрети (Settings → Secrets and variables → Actions):
#   DATABASE_URL           — зовнішній рядок підключення до БД (Render → Database → External Database URL)
#   BACKUP_PASSPHRASE      — довгий випадковий пароль шифрування (збережіть його ще й у менеджері паролів!)
#   BACKUP_HEARTBEAT_URL   — https://<ваш-api>/api/internal/backup-heartbeat   (необов'язково)
#   BACKUP_HEARTBEAT_TOKEN — той самий секрет, що в змінній BACKUP_HEARTBEAT_TOKEN на сервері (необов'язково)
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
      BACKUP_HEARTBEAT_TOKEN: ${{ secrets.BACKUP_HEARTBEAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Клієнт PostgreSQL 17 (pg_dump має бути не старший за сервер БД)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Створення зашифрованої копії
        run: ./scripts/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: |
            backup.dump.gpg
            backup.dump.gpg.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Повідомити сайт про успіх
        run: ./scripts/heartbeat.sh backup true "$(cat backup.dump.gpg.size)" "ok"
      - name: Повідомити сайт про збій
        if: failure()
        run: |
          ./scripts/heartbeat.sh backup false null "Не вдалося створити копію - див. GitHub Actions"
