name: Test restore
# Раз на місяць бере останню копію, розшифровує й відновлює її в ПОРОЖНЮ тимчасову БД, перевіряє ключові таблиці.
# Результат видно в адмінці (Налаштування → «Стан системи»); при невдачі приходить сповіщення.
# Додаткові секрети: ті самі BACKUP_PASSPHRASE, BACKUP_HEARTBEAT_URL, BACKUP_HEARTBEAT_TOKEN.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      RESTORE_DATABASE_URL: postgres://postgres:restore@localhost:5432/restore_test
      HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
      BACKUP_HEARTBEAT_TOKEN: ${{ secrets.BACKUP_HEARTBEAT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Клієнт PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Завантаження останньої успішної копії
        run: |
          RUN_ID=$(gh run list --workflow backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then echo "Немає жодної успішної копії" >&2; exit 1; fi
          gh run download "$RUN_ID" --name db-backup
      - name: Перевірка контрольної суми
        run: sha256sum -c backup.dump.gpg.sha256
      - name: Відновлення й перевірка
        run: ./scripts/restore-test.sh
      - name: Повідомити сайт про успіх
        run: ./scripts/heartbeat.sh restore_test true null "$(cat restore-report.txt)"
      - name: Повідомити сайт про збій
        if: failure()
        run: |
          ./scripts/heartbeat.sh restore_test false null "Тест відновлення провалився - див. GitHub Actions"
